name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Surface parity
        run: yarn check:surfaces

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

  client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: mcuapi-client/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: mcuapi-client
        run: yarn install --frozen-lockfile

      - name: Typecheck
        working-directory: mcuapi-client
        run: yarn typecheck

      - name: Test
        working-directory: mcuapi-client
        run: yarn test

      - name: Build
        working-directory: mcuapi-client
        run: yarn build

  mcp:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: mcuapi-mcp/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: mcuapi-mcp
        run: yarn install --frozen-lockfile

      - name: Typecheck
        working-directory: mcuapi-mcp
        run: yarn tsc --noEmit

      - name: Build
        working-directory: mcuapi-mcp
        run: yarn build
